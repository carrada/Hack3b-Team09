<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiendas 3B · Analizador de documentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="paginas.css">
  <style>
    .app { min-height: 780px; }
    /* izquierda: expediente */
    .izq { width: 288px; flex: none; background: var(--panel); border-right: 1px solid var(--borde); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
    .izq .cab { padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 10px; }
    .izq .cab a { font-size: 12px; color: var(--gris); text-decoration: none; } .izq .cab a:hover { color: var(--rojo); }
    .izq h1 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
    .veredicto { margin: 0 12px; background: #fff; border: 1px solid var(--borde); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
    .veredicto .t { font-size: 12px; color: var(--gris); }
    .veredicto .v { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
    .veredicto ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
    .veredicto li { display: flex; gap: 10px; align-items: baseline; font-size: 13px; line-height: 1.4; }
    .veredicto li b { flex: none; min-width: 22px; height: 20px; padding: 0 4px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; color: #fff; }
    .completo { padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 8px; }
    .completo .cf { display: flex; justify-content: space-between; font-size: 12px; color: var(--gris); }
    .segmentos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; } .segmentos i { height: 6px; background: var(--tinta); } .segmentos i.f { background: #B1B4B6; }
    .docs { padding: 4px 8px 16px; display: flex; flex-direction: column; }
    .doc { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 0; background: transparent; text-align: left; }
    .doc.on { background: #E8EAEB; }
    .doc .ico { width: 26px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; border: 1px solid #CFCCC4; background: #fff;
      box-shadow: inset 0 6px 0 -3px #fff, inset 0 7px 0 -3px #B1B4B6, inset 0 12px 0 -3px #fff, inset 0 13px 0 -3px #B1B4B6; }
    .doc.falta .ico { border: 1.5px dashed #B1B4B6; background: transparent; box-shadow: none; }
    .doc .tx { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
    .doc .tx b { font-size: 13px; font-weight: 500; }
    .doc .tx span { font-size: 11px; color: var(--gris); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    .doc.falta .tx span { color: #8A5A00; font-family: 'IBM Plex Sans', sans-serif; }
    .doc .cuentas { display: flex; gap: 3px; }
    .doc .cuentas i { font-style: normal; min-width: 20px; height: 20px; padding: 0 4px; font-size: 11px; font-weight: 600; color: #fff; display: flex; align-items: center; justify-content: center; }
    .leyenda { margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--linea); display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #0B0C0C; }
    .leyenda > span:first-child { color: var(--gris); }
    .leyenda div { display: flex; align-items: center; gap: 8px; }
    .gl { width: 18px; height: 18px; color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none; }

    /* centro: documento */
    .zona-visor { position: relative; flex: 1; min-height: 0; display: flex; }
    .zona-visor .scroll { padding: 28px 44px 56px 24px; flex-direction: column; align-items: center; gap: 20px; flex: 1; }
    .pagina { position: relative; width: 680px; flex: none; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .pagina > img { display: block; width: 100%; transition: opacity .2s; user-select: none; -webkit-user-drag: none; }
    .nitida { position: absolute; inset: 0; background: #fff; pointer-events: none; }
    .nitida img { display: block; width: 100%; }
    .marca { position: absolute; mix-blend-mode: multiply; pointer-events: none; transition: background .2s; }
    .foco { position: absolute; pointer-events: none; }
    .nota-n { position: absolute; right: 10px; width: 26px; height: 26px; border-radius: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0; background: #fff; }
    .mini { position: absolute; top: 16px; bottom: 16px; right: 12px; width: 18px; display: flex; flex-direction: column; gap: 4px; }
    .mini div { position: relative; flex: 1 1 0; background: #fff; border: 1px solid #CFCCC4; }
    .mini button { position: absolute; left: 1px; right: 1px; height: 6px; border: 0; padding: 0; } .mini button.sel { left: -3px; right: -3px; height: 8px; }
    .falta-card { width: 560px; max-width: 100%; min-height: 640px; border: 2px dashed #B1B4B6; background: #EFEDE7; padding: 48px 44px; display: flex; flex-direction: column; gap: 18px; }
    .falta-card .r { font-size: 12px; color: var(--gris); text-transform: uppercase; letter-spacing: .08em; }
    .falta-card h2 { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 24px; font-weight: 600; }
    .falta-card p { margin: 0; font-size: 14px; color: #0B0C0C; line-height: 1.55; }
    .falta-card ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid #B1B4B6; }
    .falta-card li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #B1B4B6; font-size: 14px; } .falta-card li span:last-child { color: var(--gris); font-size: 12px; }
    .falta-card .acc { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .falta-card .acc small { font-size: 12px; color: var(--ok); }
    .btn.g { height: 36px; padding: 0 14px; } .btn.neg { border-radius: 0; }
    .btn.peligro { border-color: #E7B3AE; color: var(--mal); }

    /* derecha: revisión */
    .lado { width: 400px; }
    .lado .cab { padding: 14px 16px 12px 20px; border-bottom: 1px solid var(--linea); display: flex; flex-direction: row; align-items: center; gap: 10px; }
    .lado .cab .tt { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .hall { padding: 16px 20px; border-bottom: 1px solid #E8EAEB; }
    .hall.sel { background: #fff; }
    .hall > button { width: 100%; border: 0; background: transparent; padding: 0; display: flex; gap: 12px; align-items: flex-start; text-align: left; }
    .hall .sv { flex: none; width: 24px; height: 24px; margin-top: 1px; color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
    .hall .cuerpo2 { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
    .hall .l1 { display: flex; gap: 8px; align-items: baseline; } .hall .l1 b { font-size: 12px; font-weight: 600; } .hall .l1 span { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 11px; color: #8E8E89; }
    .hall .ti { font-size: 15px; font-weight: 600; line-height: 1.3; }
    .hall .es { flex: none; font-size: 12px; font-weight: 600; margin-top: 4px; }
    .det { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
    .det .k { font-size: 12px; color: var(--gris); }
    .det table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border: 1px solid var(--borde); }
    .det tr { border-bottom: 1px solid #E8EAEB; } .det th { text-align: left; font-weight: 500; color: #0B0C0C; padding: 8px 10px; width: 108px; vertical-align: top; }
    .det td { padding: 8px 10px; vertical-align: top; } .det td.tg { text-align: right; white-space: nowrap; font-size: 11px; font-weight: 600; }
    .det p { margin: 0; font-size: 13px; line-height: 1.55; }
    .det .bloque { display: flex; flex-direction: column; gap: 4px; } .det .bloque.l { border-top: 1px solid #E8EAEB; padding-top: 10px; }
    .det .bloque span { font-size: 13px; line-height: 1.5; } .det .bloque code { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12px; }
    .det .acc { display: flex; gap: 6px; flex-wrap: nowrap; } .det .acc .btn { height: 34px; padding: 0 14px; white-space: nowrap; }
    .audit { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--borde); padding: 8px 10px; font-size: 12px; color: #0B0C0C; }
    .audit button { border: 0; background: transparent; padding: 0; font-size: 12px; font-weight: 500; text-decoration: underline; color: var(--tinta); }
    .valores { padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 8px; } .valores > span { font-size: 12px; color: var(--gris); }
    .valores ul { margin: 0; padding: 0; list-style: none; }
    .valores li button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px; border: 0; border-bottom: 1px solid #E8EAEB; background: transparent; text-align: left; }
    .valores li button.on { background: #E2EEE5; }
    .valores .l { font-size: 12px; color: var(--gris); } .valores .v { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; display: block; margin-top: 2px; } .valores .ok { font-size: 12px; font-weight: 600; color: var(--ok); }
  </style>
  <link rel="stylesheet" href="tema.css?v=6">
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Navegación principal"></nav>

  <aside class="izq" aria-label="Expediente">
    <div class="cab">
      <a href="index.html">← Mapa</a>
      <div style="display:flex;flex-direction:column;gap:2px">
        <span class="mono" style="font-size:11px;color:var(--gris)" id="expEtq"></span>
        <h1 id="expTitulo"></h1>
      </div>
    </div>
    <section class="veredicto" aria-label="Recomendación preliminar">
      <span class="t">Recomendación preliminar</span>
      <span class="v"><span class="cuadro" id="vCuadro" style="width:12px;height:12px"></span><span id="vTexto"></span></span>
      <span class="t">Porque:</span>
      <ul id="razones"></ul>
    </section>
    <div class="completo">
      <div class="cf"><span>Documentos del expediente</span><span id="recibidos"></span></div>
      <div class="segmentos" id="segmentos"></div>
    </div>
    <div class="docs" id="listaDocs"></div>
    <div class="leyenda">
      <span>Gravedad</span>
      <div><span class="gl" style="background:#B3261E">!</span>Bloqueante · detiene el expediente</div>
      <div><span class="gl" style="background:#B26E00">?</span>Revisar · requiere criterio legal</div>
      <div><span class="gl" style="background:#3B5E8C">i</span>Informativo · no detiene</div>
    </div>
  </aside>

  <main class="visor-col">
    <div class="barra" style="min-height:52px;flex-wrap:nowrap">
      <span id="archivo" style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</span>
      <span class="etq" id="paginasEtq"></span>
      <span class="grow"></span>
      <label id="lblDim" style="display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#0B0C0C;white-space:nowrap;cursor:pointer"><input type="checkbox" id="chkDim" checked style="width:16px;height:16px;accent-color:var(--tinta);margin:0">Atenuar lo validado</label>
      <a class="btn" id="btnAgentes" href="revision.html">Revisión por agentes</a>
      <select id="selZoom" aria-label="Zoom"><option value="75">75%</option><option value="100" selected>100%</option><option value="125">125%</option></select>
    </div>
    <div class="zona-visor">
      <div class="scroll" id="scroll"></div>
      <div class="mini" id="mini" aria-label="Mapa del documento"></div>
    </div>
  </main>

  <aside class="lado" aria-label="Para revisión humana">
    <div class="cab">
      <div class="tt"><h2>Para revisión humana</h2><span class="sub" id="pendLabel"></span></div>
      <button class="btn ico" id="fAnt" aria-label="Hallazgo anterior"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="btn ico" id="fSig" aria-label="Hallazgo siguiente"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="cuerpo" id="cuerpoLado"></div>
  </aside>
</div>
<input type="file" id="fArchivo" accept="application/pdf,.pdf" hidden>

<script src="tiendas.js?v=3"></script>
<script src="modulo.js"></script>
<script>
(() => {
  const { Datos, Estado, TIPOS, SEV, hallazgos, hora, recibir, rail, escapar, parametros } = Modulo;
  const $ = id => document.getElementById(id);
  const P = parametros(), EXP = P.get('exp') || 'demo';
  const NOMBRES = { escrituras: 'Escritura', predial: 'Predial', alineamiento: 'Alineamiento y Número Oficial', uso: 'Uso de Suelo' };
  const BLOQUEA = {
    escrituras: ['Titular y dirección del inmueble', 'Superficie, medidas y colindancias', 'Libertad de gravamen'],
    predial: ['Contribuyente contra el titular de la escritura', 'Superficie registrada contra la escritura', 'Dirección del inmueble contra la escritura'],
    alineamiento: ['Número oficial del inmueble', 'Alineamiento sobre la vía pública', 'Dirección oficial contra escritura y predial'],
    uso: ['Uso comercial autorizado', 'Restricciones o condicionantes', 'Superficie aplicable', 'Vigencia del certificado']
  };
  const FIN = { ok: ['Confirmado', '#2F7A4A'], fix: ['Corregido', '#2F7A4A'], no: ['No cumple', '#B3261E'] };
  const COMP = { diff: ['color:#B3261E;font-weight:600', 'no coincide', '#B3261E'], warn: ['', 'incompleto', '#B26E00'], ok: ['', 'coincide', '#2F7A4A'], miss: ['color:#8E8E89;font-style:italic', 'falta', '#8E8E89'] };

  const ans = {}; let an = null, expCat = null, lista = [], docSel = 'escrituras', sel = null, loc = null, dim = true, zoom = 100, editando = null;
  $('rail').innerHTML = rail('expedientes');

  const dec = () => an ? (Estado.get(EXP).dec[an.id] || {}) : {};
  const corr = () => an ? (Estado.get(EXP).corr[an.id] || {}) : {};
  const tiempos = () => an ? (Estado.get(EXP).tiempos[an.id] || {}) : {};
  const docs = () => Estado.get(EXP).docs;
  const solicitados = () => Estado.get(EXP).solic;
  const pend = () => lista.filter(h => !dec()[h.n]);
  const faltantes = () => TIPOS.filter(t => !docs()[t.k]);
  const decDe = k => ans[k] ? (Estado.get(EXP).dec[ans[k].id] || {}) : {};
  const listaDe = k => ans[k] ? hallazgos(ans[k], docs()) : [];
  const pendDe = k => listaDe(k).filter(h => !decDe(k)[h.n]);
  const todos = () => TIPOS.map(t => t.k).filter(k => ans[k]);      // documentos con análisis

  function datosExp() {
    if (expCat) return { etq: `EXP · ${expCat.municipio}`, dir: expCat.nombre };
    const t = (typeof TIENDAS === 'undefined' ? [] : TIENDAS).find(x => x.id === EXP);
    if (t) return { etq: `EXP-${EXP.replace(/\D/g, '')} · Tienda 3B, CP ${t.cp}`, dir: t.dir };
    try { const z = (JSON.parse(localStorage.getItem('lugares')) || []).find(f => f.properties && f.properties.id === EXP);
      if (z) return { etq: `EXP-${EXP.replace(/\W/g, '').slice(-6).toUpperCase()} · Zona ${z.properties.estado === 'verde' ? 'verde' : 'roja'}`, dir: z.properties.nombre || z.properties.direccion || 'zona marcada' }; } catch (e) {}
    return { etq: 'EXP-0000 · Expediente de demostración', dir: 'ejemplo' };
  }

  /* ---------- izquierda ---------- */
  function pintarIzq() {
    const d = datosExp(), faltan = faltantes(), recib = 4 - faltan.length;
    $('expEtq').textContent = d.etq;
    $('expTitulo').textContent = expCat ? expCat.nombre : (ans.escrituras ? ans.escrituras.titulo.split(' · ')[0] : 'Expediente') + ' · ' + d.dir;

    // el veredicto cuenta todos los documentos recibidos; los que faltan no impiden analizar, solo quedan como pendientes
    const nNo = todos().reduce((s, k) => s + listaDe(k).filter(h => decDe(k)[h.n] === 'no').length, 0);
    const pB = todos().reduce((s, k) => s + pendDe(k).filter(h => h.sev === 'bloq').length, 0), pR = todos().reduce((s, k) => s + pendDe(k).filter(h => h.sev !== 'bloq').length, 0);
    const nOk = todos().reduce((s, k) => s + ans[k].pasos.filter(p => p.ok).length, 0);
    const razones = [];
    const R = (n, t, c) => razones.push(`<li><b style="background:${c}">${n}</b><span>${t}</span></li>`);
    if (nNo) R(nNo, nNo === 1 ? 'hallazgo marcado como no cumple' : 'hallazgos marcados como no cumple', '#B3261E');
    if (faltan.length) R(faltan.length, 'documentos faltantes: ' + escapar(faltan.map(t => NOMBRES[t.k]).join(', ')), '#505A5F');
    if (pB) R(pB, pB === 1 ? 'hallazgo bloqueante sin resolver' : 'hallazgos bloqueantes sin resolver', '#B3261E');
    if (pR) R(pR, pR === 1 ? 'hallazgo por revisar' : 'hallazgos por revisar', '#B26E00');
    R(nOk, 'datos validados sin observaciones', '#2F7A4A');
    const v = nNo ? ['No cumple', '#B3261E'] : (pB || pR || faltan.length) ? ['Requiere revisión', '#E0A100'] : ['Cumple', '#2F7A4A'];
    $('vCuadro').style.background = v[1]; $('vTexto').textContent = v[0]; $('razones').innerHTML = razones.join('');

    $('recibidos').textContent = `${recib} de 4 recibidos`;
    $('segmentos').innerHTML = TIPOS.map(t => `<i class="${docs()[t.k] ? '' : 'f'}"></i>`).join('');
    $('listaDocs').innerHTML = TIPOS.map(t => {
      const dd = docs()[t.k], falta = !dd, on = docSel === t.k;
      const cuentas = ans[t.k] ? ['bloq', 'rev', 'info'].map(k => [k, pendDe(t.k).filter(h => h.sev === k).length]).filter(c => c[1])
        .map(([k, n]) => `<i style="background:${SEV[k].color}" title="${SEV[k].label}">${n}</i>`).join('') : '';
      const sub = falta ? (solicitados()[t.k] ? 'Faltante · solicitado' : `Faltante · bloquea ${BLOQUEA[t.k].length} validaciones`)
        : (dd.analisis ? (dd.archivo + (cuentas ? '' : ' · revisado')) : dd.archivo + ' · en cola');
      return `<button class="doc ${on ? 'on' : ''} ${falta ? 'falta' : ''}" data-doc="${t.k}" aria-pressed="${on}"><span class="ico">${falta ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E8E89" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>' : ''}</span>
        <span class="tx"><b>${NOMBRES[t.k]}</b><span>${escapar(sub)}</span></span><span class="cuentas">${cuentas}</span></button>`;
    }).join('');
  }

  /* ---------- centro ---------- */
  const estadoMarca = h => dec()[h.n];
  function pintarVisor() {
    const sc = $('scroll'), dd = docs()[docSel], falta = !dd, hayPaginas = !falta && !!an;
    $('lblDim').hidden = !hayPaginas; $('mini').hidden = !hayPaginas;
    $('archivo').textContent = falta ? 'no recibido' : dd.archivo;
    $('paginasEtq').textContent = hayPaginas ? (an.paginas.length === 1 ? '1 página' : an.paginas.length + ' páginas') : '';
    if (falta) {
      const bl = BLOQUEA[docSel], s = solicitados()[docSel];
      sc.innerHTML = `<div class="falta-card"><span class="r">Documento faltante</span><h2>${NOMBRES[docSel]}</h2>
        <p>Sin este documento no se pueden hacer estas validaciones:</p>
        <ul>${bl.map(b => `<li><span>${escapar(b)}</span><span>bloqueada</span></li>`).join('')}</ul>
        <div class="acc"><button class="btn neg g" id="btnSolic" ${s ? 'disabled' : ''}>${s ? 'Solicitado' : 'Solicitar documento'}</button><button class="btn g" id="btnSubir">Subir PDF</button>
        ${s ? '<small>Solicitud registrada en el expediente</small>' : ''}</div></div>`;
      $('mini').innerHTML = ''; return;
    }
    if (!hayPaginas) { sc.innerHTML = `<div class="falta-card" style="border-style:solid"><span class="r">Documento recibido</span><h2>${NOMBRES[docSel]}</h2><p>${escapar(dd.archivo)} ya está en el expediente. Los agentes todavía no devuelven su análisis, así que no hay hallazgos que mostrar.</p></div>`; $('mini').innerHTML = ''; return; }

    const z = zoom / 100, activo = h => sel === h.n, resalta = h => !dec()[h.n] || activo(h);
    sc.innerHTML = an.paginas.map(pg => {
      const enPag = lista.filter(h => h.pagina === pg.n);
      const loc2 = loc ? an.pasos.find(p => p.n === loc && p.pagina === pg.n) : null;
      const foco = enPag.filter(h => resalta(h) || dec()[h.n]).map(h => h.rect).concat(loc2 ? [loc2.rect] : []);
      const clip = r => `inset(${r[1] * 100}% ${(1 - r[0] - r[2]) * 100}% ${(1 - r[1] - r[3]) * 100}% ${r[0] * 100}% round 2px)`;
      let html = `<article class="pagina" style="zoom:${z}" id="pg-${pg.n}"><img alt="Página ${pg.n}" src="${pg.img}" style="opacity:${dim ? .4 : 1}">`;
      if (dim) html += foco.map(r => `<div class="nitida" style="clip-path:${clip(r)}"><img alt="" src="${pg.img}"></div>`).join('');
      enPag.forEach(h => {
        const e = estadoMarca(h), sv = SEV[h.sev], bg = e ? (e === 'no' ? '#F6DAD6' : '#E2EEE5') : sv.soft, r = h.rect;
        html += `<div class="marca" style="left:${r[0] * 100}%;top:${r[1] * 100}%;width:${r[2] * 100}%;height:${r[3] * 100}%;background:${bg}"></div>`;
        if (activo(h) && !e) html += `<div class="foco" style="left:${r[0] * 100}%;top:${r[1] * 100}%;width:${r[2] * 100}%;height:${r[3] * 100}%;outline:1.5px solid ${sv.color};outline-offset:1px"></div>`;
        const c = e ? (e === 'no' ? '#B3261E' : '#2F7A4A') : sv.color;
        html += `<button class="nota-n" id="mk-${h.n}" data-sel="${h.n}" aria-label="Hallazgo ${h.num}: ${escapar(h.titulo)}" style="top:calc(${(r[1] + r[3] / 2) * 100}% - 13px);border:1.5px solid ${c};${activo(h) ? `background:${c};color:#fff` : `color:${c}`}">${+h.num}</button>`;
      });
      if (loc2) html += `<div class="marca" style="left:${loc2.rect[0] * 100}%;top:${loc2.rect[1] * 100}%;width:${loc2.rect[2] * 100}%;height:${loc2.rect[3] * 100}%;background:#E2EEE5"></div><div class="foco" id="loc" style="left:${loc2.rect[0] * 100}%;top:${loc2.rect[1] * 100}%;width:${loc2.rect[2] * 100}%;height:${loc2.rect[3] * 100}%;outline:1.5px solid #2F7A4A;outline-offset:2px"></div>`;
      return html + '</article>';
    }).join('');
    $('mini').innerHTML = an.paginas.map(pg => `<div>${lista.filter(h => h.pagina === pg.n).map(h => {
      const e = estadoMarca(h), c = e ? (e === 'no' ? '#B3261E' : '#2F7A4A') : SEV[h.sev].color;
      return `<button class="${activo(h) ? 'sel' : ''}" data-sel="${h.n}" aria-label="Ir al hallazgo ${+h.num}" style="top:${Math.round((h.rect[1] + h.rect[3] / 2) * 100)}%;background:${c}"></button>`; }).join('')}</div>`).join('');
  }

  /* ---------- derecha ---------- */
  function pintarLado() {
    const dd = docs()[docSel];
    if (!dd) { $('pendLabel').textContent = 'Documento faltante'; $('cuerpoLado').innerHTML = '<p class="vacio" style="border-bottom:1px solid #E8EAEB">Este documento aún no se recibe. Las validaciones que dependen de él aparecen como bloqueadas.</p>'; return; }
    if (!an) { $('pendLabel').textContent = 'En cola de análisis'; $('cuerpoLado').innerHTML = '<p class="vacio">El documento se recibió. Cuando el backend devuelva su análisis, los hallazgos aparecerán aquí.</p>'; return; }
    const p = pend().length, d = dec(), c = corr(), t = tiempos();
    $('pendLabel').textContent = !lista.length ? 'Sin hallazgos' : p === 0 ? 'Todo resuelto en este documento' : `${p} ${p === 1 ? 'pendiente' : 'pendientes'} de ${lista.length}`;
    const filas = lista.map(h => {
      const e = d[h.n], on = sel === h.n, sv = SEV[h.sev];
      const cmp = h.compare.map(([doc, v, tag]) => { const m = COMP[tag]; return `<tr><th scope="row">${escapar(doc)}</th><td style="${m[0]}">${escapar(v)}</td><td class="tg" style="color:${m[2]}">${m[1]}</td></tr>`; }).join('');
      const cerrado = e ? `<div class="audit"><span>${FIN[e][0]} por ti · ${hora(t[h.n] || Date.now())}${e === 'fix' && c[h.n] ? ` · valor: <b>${escapar(c[h.n])}</b>` : ''}</span><button data-d="undo:${h.n}">Deshacer</button></div>` : '';
      const acciones = e ? '' : editando === h.n
        ? `<div class="editor"><input id="valCorr" value="${escapar(c[h.n] || (/No legible|Contraste/.test(h.valor) ? '' : h.valor))}" aria-label="Valor correcto" placeholder="Valor correcto según el documento"><button class="btn neg" data-guardar="${h.n}">Guardar</button><button class="btn" data-cancelar>Cancelar</button></div>`
        : `<div class="acc"><button class="btn neg" data-d="ok:${h.n}">Confirmar</button><button class="btn" data-d="edit:${h.n}">Corregir</button><button class="btn peligro" data-d="no:${h.n}">Marcar no cumple</button></div>`;
      return `<div class="hall ${on ? 'sel' : ''}" style="${on ? `box-shadow:inset 3px 0 0 ${sv.color}` : ''}"><button data-sel="${on ? '' : h.n}" aria-expanded="${on}">
          <span class="sv" style="background:${sv.color}">${sv.glyph}</span>
          <span class="cuerpo2"><span class="l1"><b style="color:${sv.color}">${sv.label}</b><span>${h.num} · pág. ${h.pagina}</span></span><span class="ti">${escapar(h.titulo)}</span></span>
          <span class="es" style="color:${e ? FIN[e][1] : '#505A5F'}">${e ? FIN[e][0] : 'Pendiente'}</span></button>
        ${on ? `<div class="det"><div style="display:flex;flex-direction:column;gap:6px"><span class="k">Qué dice cada documento</span><table><tbody>${cmp}</tbody></table></div>
          <p>${escapar(h.reason)}</p>
          <div class="bloque l"><span class="k">Fundamento</span><span><code>${h.ruleId}</code> · ${escapar(h.rule)}</span></div>
          <div class="bloque"><span class="k">Siguiente paso sugerido</span><span>${escapar(h.next)}</span></div>${acciones}${cerrado}</div>` : ''}</div>`;
    }).join('');
    const ok = an.pasos.filter(x => x.ok);
    $('cuerpoLado').innerHTML = filas + `<div class="valores"><span>Validado sin observaciones (${ok.length}) · clic para ver en el documento</span><ul>${ok.map(o =>
      `<li><button data-loc="${o.n}" class="${loc === o.n ? 'on' : ''}"><span><span class="l">${escapar(o.campo)}</span><span class="v">${escapar(c[o.n] || o.valor)}</span></span><span class="ok">ok</span></button></li>`).join('')}</ul></div>`;
  }

  function pintar() { pintarIzq(); pintarVisor(); pintarLado(); }

  /* ---------- acciones ---------- */
  function irA(id) {
    setTimeout(() => { const el = $(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 40);
  }
  function seleccionar(n) { sel = n || null; loc = null; editando = null; pintar(); if (n) irA('mk-' + n); }
  function ciclar(paso) {
    if (!lista.length) return;
    const i = lista.findIndex(h => h.n === sel), j = i < 0 ? (paso > 0 ? 0 : lista.length - 1) : (i + paso + lista.length) % lista.length;
    seleccionar(lista[j].n);
  }

  $('cuerpoLado').addEventListener('click', e => {
    const s = e.target.closest('[data-sel]'); if (s) return seleccionar(+s.dataset.sel || null);
    const l = e.target.closest('[data-loc]'); if (l) { loc = +l.dataset.loc; sel = null; pintar(); return irA('loc'); }
    const d = e.target.closest('[data-d]');
    if (d) { const [acc, n] = d.dataset.d.split(':'); if (acc === 'edit') { editando = +n; return pintarLado(); }
      Estado.decidir(EXP, an.id, +n, acc === 'undo' ? null : acc); return pintar(); }
    const g = e.target.closest('[data-guardar]'); if (g) { const v = $('valCorr').value.trim(); Estado.decidir(EXP, an.id, +g.dataset.guardar, 'fix', v || undefined); editando = null; return pintar(); }
    if (e.target.closest('[data-cancelar]')) { editando = null; pintarLado(); }
  });
  $('scroll').addEventListener('click', e => {
    const b = e.target.closest('[data-sel]'); if (b) return seleccionar(+b.dataset.sel);
    if (e.target.closest('#btnSolic')) { const s = Object.assign({}, solicitados()); s[docSel] = true; Estado.set(EXP, { solic: s }); return pintar(); }
    if (e.target.closest('#btnSubir')) { $('fArchivo').value = ''; $('fArchivo').click(); }
  });
  $('mini').addEventListener('click', e => { const b = e.target.closest('[data-sel]'); if (b) seleccionar(+b.dataset.sel); });
  $('listaDocs').addEventListener('click', e => { const b = e.target.closest('[data-doc]'); if (b) { elegirDoc(b.dataset.doc); pintar(); } });
  $('fArchivo').addEventListener('change', async e => {
    if (!e.target.files.length) return;
    await recibir(EXP, [...e.target.files], docSel, alAvanzar); await cargar(); elegirDoc(docSel); pintar();
  });
  // el backend avisa cuando los agentes terminan: se recargan los análisis y se vuelve a pintar
  async function alAvanzar(ev) {
    if (ev.estado === 'listo' || ev.estado === 'error') {
      await cargar();
      // los agentes clasifican por contenido: si el PDF resultó de otro tipo, se abre donde quedó
      const k = docs()[docSel] ? docSel : (TIPOS.find(t => ans[t.k]) || {}).k || docSel;
      elegirDoc(k); pintar();
    }
    if (ev.estado === 'error') $('pendLabel').textContent = 'El análisis falló: ' + (ev.error || 'error del backend');
  }
  $('chkDim').onchange = e => { dim = e.target.checked; pintarVisor(); };
  $('selZoom').onchange = e => { zoom = +e.target.value; pintarVisor(); };
  $('fAnt').onclick = () => ciclar(-1); $('fSig').onclick = () => ciclar(1);

  /* ---------- carga ---------- */
  function elegirDoc(k) {
    docSel = k; an = ans[k] || null; lista = an ? hallazgos(an, docs()) : []; sel = lista.length ? lista[0].n : null; loc = null; editando = null;
    $('btnAgentes').href = an ? `revision.html?exp=${encodeURIComponent(EXP)}&doc=${encodeURIComponent(an.id)}` : 'revision.html';
  }
  async function cargar() {
    const cat = await Datos.expedientes(); expCat = cat.find(x => x.id === EXP) || null;
    let e = Estado.get(EXP); const pedido = P.get('doc') && (await Datos.indice()).find(d => d.id === P.get('doc'));
    if (pedido) Estado.set(EXP, { docs: Object.assign({}, e.docs, { [pedido.tipo || 'escrituras']: { analisis: pedido.id, archivo: pedido.archivo } }) });
    else if (EXP === 'demo' && !Object.keys(e.docs).length) { expCat = cat.find(x => x.id === 'tepeji5') || cat[0] || null; if (expCat) await Modulo.asignarDocumentos(EXP, expCat); }
    else if (expCat && !Object.keys(e.docs).length) await Modulo.asignarDocumentos(EXP, expCat);   // los documentos que ya tenemos se asignan solos
    for (const t of TIPOS) { const d = docs()[t.k]; ans[t.k] = d && d.analisis ? await Datos.analisis(d.analisis) : null; }
  }
  (async () => {
    await cargar();
    const conDetalle = TIPOS.find(t => ans[t.k] && pendDe(t.k).length), primero = TIPOS.find(t => ans[t.k]) || TIPOS.find(t => docs()[t.k]);
    elegirDoc(conDetalle ? conDetalle.k : ans.escrituras || !primero ? 'escrituras' : primero.k);        // viene del mapa: abre donde hay detalles por verificar
    const pedido = an && an.pasos.find(x => x.n === +P.get('sel'));
    if (pedido) { const h = lista.find(x => x.n === pedido.n); if (h) sel = h.n; else { sel = null; loc = pedido.n; } }
    pintar(); if (sel) irA('mk-' + sel); else if (loc) irA('loc');
    Modulo.retomar(EXP, alAvanzar);
  })();

  window.__analizador = { estado: () => ({ id: an && an.id, sel, loc, doc: docSel, pendientes: pend().length, hallazgos: lista.length, dim, zoom }), seleccionar };
})();
</script>
</body>
</html>
