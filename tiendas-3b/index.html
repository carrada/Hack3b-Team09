<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiendas 3B</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.35.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.35.0/mapbox-gl.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --rojo: #C8102E; --rojo-osc: #9E0C24; --tinta: #1B1B1A; --gris: #6A6A65; --borde: #DEDCD5; --linea: #E6E4DE; --fondo: #F2F1ED; --panel: #FAFAF8;
      --ok: #2F7A4A; --aviso: #B26E00; --mal: #B3261E; --azul: #1F5FA8; --lado: 400px; --exp: 440px; --rail: 64px; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; color: var(--tinta); }
    body { display: flex; background: var(--fondo); overflow: hidden; }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }
    .mono { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    /* barra lateral: la misma que en el analizador */
    #side { width: var(--rail); background: var(--rojo); display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 6px; flex: none; z-index: 5; }
    #side .logo { width: 36px; height: 36px; border-radius: 6px; background: #fff; color: var(--rojo); font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
    #side .ic { width: 44px; height: 44px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.82); cursor: pointer; border: 0; background: none; text-decoration: none; }
    #side .ic:hover { color: #fff; background: rgba(255,255,255,.14); }
    #side .ic.on { background: var(--rojo-osc); color: #fff; }

    /* los paneles flotan sobre el mapa y se deslizan: el mapa no cambia de tamaño, así no parpadea.
       --izq es el ancho que ocupa el panel visible; lo usan el mapa (relleno) y los controles. */
    body { position: relative; --izq: var(--lado); }
    body.oculta { --izq: 0px; }
    body.exp { --izq: var(--exp); }
    #panel { position: absolute; left: var(--rail); top: 0; bottom: 0; width: var(--lado); z-index: 3; background: var(--panel); border-right: 1px solid var(--borde);
      transition: transform .25s ease, visibility 0s; }
    body.oculta #panel, body.exp #panel { transform: translateX(-100%); visibility: hidden; transition: transform .25s ease, visibility 0s .25s; }
    .panel-in { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .mapboxgl-ctrl-bottom-left { left: var(--izq); transition: left .25s ease; }
    .mapboxgl-ctrl-group { border-radius: 4px !important; box-shadow: 0 0 0 1px var(--borde) !important; }
    #panel header { padding: 18px 18px 14px; border-bottom: 1px solid var(--borde); }
    .titulo { display: flex; align-items: center; gap: 10px; }
    .titulo h1 { font-size: 17px; font-weight: 600; margin: 0; }
    .titulo .n { color: var(--gris); font-size: 11px; margin-left: auto; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    .ocultar { border: 1px solid #D3D1CA; background: #fff; width: 30px; height: 30px; border-radius: 4px; color: var(--tinta); display: flex; align-items: center; justify-content: center; }
    .ocultar:hover { background: #F6F5F1; }
    .ocultar .i { width: 16px; height: 16px; }
    .buscar { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 0 10px; border: 1px solid #D3D1CA; border-radius: 4px; background: #fff; color: var(--gris); }
    .buscar .i { width: 16px; height: 16px; }
    .buscar input { flex: 1; border: 0; background: none; outline: none; padding: 9px 0; font-size: 13px; color: var(--tinta); }
    .buscar:focus-within { border-color: var(--tinta); }
    #chips { display: flex; flex-wrap: wrap; gap: 1px; margin-top: 12px; border: 1px solid #D3D1CA; border-radius: 4px; overflow: hidden; background: #D3D1CA; }
    .chip { flex: 1 1 auto; border: 0; background: #fff; padding: 0 8px; height: 30px; font-size: 12px; font-weight: 500; color: #3A3A37; white-space: nowrap; }
    .chip:hover { background: #F6F5F1; }
    .chip.on { background: var(--tinta); color: #fff; }
    #lista { overflow-y: auto; flex: 1; }
    .card { background: transparent; border: 0; border-bottom: 1px solid var(--linea); border-left: 3px solid transparent; padding: 12px 18px 12px 15px; cursor: pointer; }
    .card:hover { background: #F4F3EE; }
    .card.on { background: #ECEAE4; border-left-color: var(--tinta); }
    .card .fila { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card b { font-size: 13px; font-weight: 600; }
    .card .dir { margin: 3px 0 5px; font-size: 14px; line-height: 1.35; }
    .card .meta { font-size: 11px; color: var(--gris); display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    /* logo de Tiendas 3B sobre México: se ve a escala global y se desvanece al acercar */
    .logo-mx { width: 78px; height: 78px; border-radius: 50%; background: #fff url(recursos/logo3b.jpg) center / cover; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(27,27,26,.25), 0 6px 16px rgba(0,0,0,.28); cursor: pointer; transition: opacity .25s; }
    /* investigación: zonas elegidas para analizar en lote */
    .invbox { padding: 14px 18px; border-bottom: 1px solid var(--borde); background: #fff; display: flex; flex-direction: column; gap: 10px; }
    .invbox .cuentas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--borde); border: 1px solid var(--borde); }
    .invbox .cuentas div { background: var(--panel); padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; }
    .invbox .cuentas b { font-size: 20px; font-weight: 500; line-height: 1.1; } .invbox .cuentas span { font-size: 11px; color: var(--gris); }
    .invbox .acc { display: flex; gap: 6px; flex-wrap: wrap; }
    .bt { height: 32px; padding: 0 12px; border-radius: 4px; border: 1px solid #D3D1CA; background: #fff; color: var(--tinta); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
    .bt:hover { background: #F6F5F1; } .bt.neg { background: var(--tinta); border-color: var(--tinta); color: #fff; } .bt.neg:hover { background: #333; } .bt.rojo { background: var(--rojo); border-color: var(--rojo); color: #fff; } .bt:disabled { opacity: .4; cursor: default; }
    .estado { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
    .estado i { width: 9px; height: 9px; display: inline-block; flex: none; }
    .card .chk-inv { width: 16px; height: 16px; accent-color: var(--tinta); margin: 0 8px 0 0; flex: none; cursor: pointer; }
    .card .acciones { display: flex; gap: 6px; margin-top: 8px; }
    .btn-inv { border: 1px solid #D3D1CA; background: #fff; border-radius: 4px; padding: 4px 8px; font-size: 12px; font-weight: 500; color: var(--tinta); }
    .btn-inv:hover { background: #F6F5F1; } .btn-inv.on { background: var(--tinta); color: #fff; border-color: var(--tinta); }
    .dot { width: 8px; height: 8px; background: #B9B6AD; display: inline-block; flex: none; }
    .dot.verde { background: var(--ok); } .dot.rojo { background: var(--mal); }
    .badge { background: #E6E4DE; color: #3A3A37; border-radius: 2px; padding: 2px 6px; font-size: 11px; font-weight: 500; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    .badge.ambar { background: #FFF1C2; color: #7A4B00; }
    .badge.verde { background: #DDEBE1; color: #1F5A37; }
    .vacio { color: var(--gris); font-size: 13px; padding: 18px; }

    /* expediente: ocupa el lugar del panel de tiendas, a la izquierda */
    #drawer { position: absolute; left: var(--rail); top: 0; bottom: 0; width: var(--exp); z-index: 4; background: var(--panel); border-right: 1px solid var(--borde);
      display: flex; flex-direction: column; overflow: hidden;
      transform: translateX(-100%); visibility: hidden; transition: transform .25s ease, visibility 0s .25s; }
    body.exp #drawer { transform: none; visibility: visible; transition: transform .25s ease, visibility 0s; }
    .dh { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 10px; gap: 10px; border-bottom: 1px solid var(--linea); }
    .dchips { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill { border-radius: 2px; padding: 4px 8px; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 7px; background: #E6E4DE; color: #3A3A37; }
    .pill.verde { background: #DDEBE1; color: #1F5A37; } .pill.rojo { background: #F6DAD7; color: #8C1C15; }
    .x { border: 1px solid #D3D1CA; background: #fff; width: 30px; height: 30px; border-radius: 4px; font-size: 13px; flex: none; color: var(--tinta); }
    .x:hover { background: #F6F5F1; }
    .dbody { overflow-y: auto; flex: 1; padding: 4px 18px 16px; }
    .dbody label { display: block; font-size: 12px; font-weight: 500; color: var(--gris); margin: 14px 0 5px; }
    .dbody input.campo { width: 100%; height: 36px; padding: 0 10px; border: 1px solid #D3D1CA; border-radius: 4px; font-size: 14px; outline: none; background: #fff; color: var(--tinta); }
    .dbody input.campo:focus { border-color: var(--tinta); }
    .reco { background: #fff; border: 1px solid var(--borde); padding: 12px 14px 14px; margin-top: 16px; }
    .reco .rt { display: flex; justify-content: space-between; font-size: 12px; color: var(--gris); }
    .reco .rt b:first-child { font-weight: 500; }
    .reco .rt b { color: var(--tinta); font-weight: 600; }
    .reco .rb { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
    .reco .rb button { border: 1px solid #D3D1CA; background: #fff; border-radius: 4px; padding: 8px 4px; font-size: 13px; font-weight: 500; color: var(--tinta); }
    .reco .rb button:hover { background: #F6F5F1; }
    .rb .c.on { background: #DDEBE1; border-color: var(--ok); color: #1F5A37; } .rb .r.on { background: #FFF1C2; border-color: var(--aviso); color: #7A4B00; } .rb .n.on { background: #F6DAD7; border-color: var(--mal); color: #8C1C15; }
    .bar { height: 4px; background: #E6E4DE; margin-top: 12px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--tinta); }
    .tabs2 { display: flex; gap: 2px; border-bottom: 1px solid var(--borde); margin: 16px -18px 0; padding: 0 18px; }
    .tabs2 button { flex: 1 1 auto; border: 0; background: none; padding: 10px 4px; font-size: 12px; font-weight: 500; color: var(--gris); border-bottom: 2px solid transparent; margin-bottom: -1px; text-align: center; line-height: 1.2; }
    .tabs2 button:hover { color: var(--tinta); }
    .tabs2 button.on { color: var(--tinta); border-bottom-color: var(--tinta); }
    .tc h3 { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 600; margin: 16px 0 10px; }
    .tc h3 span { font-size: 12px; font-weight: 400; color: var(--gris); }
    .doc { display: flex; align-items: center; gap: 10px; border: 1px solid var(--borde); background: #fff; padding: 10px 12px; margin-bottom: 6px; }
    .doc .ico { width: 26px; height: 32px; border: 1px solid #CFCCC4; background: #fff; display: flex; align-items: center; justify-content: center; color: var(--gris); flex: none; }
    .doc .ico .i { width: 14px; height: 14px; }
    .doc .tx { flex: 1; min-width: 0; } .doc .tx b { font-size: 13px; font-weight: 500; } .doc .tx small { display: block; color: var(--gris); font-size: 11px; line-height: 1.3; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; }
    .est { border-radius: 2px; padding: 2px 6px; font-size: 11px; font-weight: 600; background: #FFF1C2; color: #7A4B00; white-space: nowrap; }
    .est.ok { background: #DDEBE1; color: #1F5A37; }
    .doc .sub { border: 1px solid #D3D1CA; background: #fff; border-radius: 4px; padding: 6px 10px; font-size: 12px; font-weight: 500; text-align: center; line-height: 1.15; color: var(--tinta); }
    .doc .sub:hover { background: #F6F5F1; }
    .vacio2 { color: var(--gris); font-size: 13px; padding: 14px 2px; line-height: 1.5; }
    .df { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--borde); background: var(--panel); }
    .df button { border-radius: 4px; height: 36px; padding: 0 14px; font-size: 13px; font-weight: 500; }
    .df .bor { border: 1px solid #D3D1CA; background: #fff; color: var(--tinta); flex: 0 0 auto; }
    .df .bor:hover { background: #F6F5F1; }
    .df .ana { flex: 1; border: 1px solid var(--tinta); background: var(--tinta); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .df .ana:hover { background: #333; }

    /* mapa: controles planos, con un filo en lugar de sombra */
    #mapwrap { flex: 1; position: relative; min-width: 0; }
    #map { position: absolute; inset: 0; }
    .superior { position: absolute; top: 14px; left: calc(14px + var(--izq)); transition: left .25s ease; z-index: 2; display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; right: 330px; }
    .btn-mapa { display: flex; align-items: center; gap: 8px; border: 1px solid #D3D1CA; background: #fff; border-radius: 4px; padding: 0 12px; height: 34px; font-size: 13px; font-weight: 500; color: var(--tinta); }
    .btn-mapa .i { width: 16px; height: 16px; }
    .btn-mapa:hover { background: #F6F5F1; }
    .btn-mapa.on { background: var(--tinta); border-color: var(--tinta); color: #fff; }
    .toggle { display: flex; border: 1px solid #D3D1CA; border-radius: 4px; overflow: hidden; background: #fff; }
    .toggle div { display: flex; }
    .toggle button { border: 0; background: #fff; padding: 0 12px; height: 32px; font-size: 13px; font-weight: 500; color: #3A3A37; }
    .toggle button + button { border-left: 1px solid #D3D1CA; }
    .toggle button.on { background: var(--tinta); color: #fff; }
    .resumen { position: absolute; top: 14px; right: 14px; z-index: 2; background: #fff; border: 1px solid #D3D1CA; border-radius: 4px; padding: 0 14px; height: 34px; display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--gris); }
    .resumen b { color: var(--tinta); font-size: 13px; font-weight: 600; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    .resumen span { display: flex; align-items: center; gap: 6px; white-space: nowrap; }

    /* menú desplegable para agregar una zona */
    .zmenu { position: relative; }
    #zpop { position: absolute; top: 42px; left: 0; width: 360px; background: var(--panel); border: 1px solid #BFBDB5; border-radius: 4px; box-shadow: 0 6px 18px rgba(27,27,26,.16); padding: 14px; display: flex; flex-direction: column; gap: 12px; z-index: 4; }
    #zpop h4 { margin: 0; font-size: 12px; color: var(--gris); font-weight: 500; }
    .dirbox { display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid #D3D1CA; border-radius: 4px; background: #fff; color: var(--gris); min-width: 0; }
    .dirbox .i { width: 16px; height: 16px; }
    .dirbox input { flex: 1; border: 0; background: none; outline: none; padding: 9px 0; font-size: 13px; min-width: 0; color: var(--tinta); }
    .dirbox:focus-within { border-color: var(--tinta); }
    .fila-m { display: flex; gap: 8px; }
    .seg { display: flex; border: 1px solid #D3D1CA; border-radius: 4px; overflow: hidden; flex: 1; background: #fff; }
    .seg button { flex: 1; border: 0; background: #fff; padding: 0 10px; height: 32px; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 7px; color: #3A3A37; }
    .seg button + button { border-left: 1px solid #D3D1CA; }
    .seg button.on { background: var(--tinta); color: #fff; }
    .btn-negro { border: 1px solid var(--tinta); background: var(--tinta); color: #fff; border-radius: 4px; padding: 0 16px; font-size: 13px; font-weight: 500; }
    .btn-negro:hover { background: #333; }
    .sep { border: 0; border-top: 1px solid var(--borde); margin: 0; }
    .zona { border: 1px solid; border-radius: 4px; height: 34px; padding: 0 12px; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
    .zona .i { width: 16px; height: 16px; }
    .zona.rojo { background: #FBEDEB; border-color: #E7B3AE; color: #8C1C15; }
    .zona.verde { background: #EAF3EC; border-color: #B5D3BF; color: #1F5A37; }
    #barraDibujo { position: absolute; left: calc(50% + var(--izq) / 2); transition: left .25s ease; bottom: 30px; transform: translateX(-50%); z-index: 3; background: #fff; border: 1px solid #BFBDB5; border-radius: 4px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: #3A3A37; }
    #barraDibujo button { border-radius: 4px; height: 30px; padding: 0 12px; font-size: 13px; font-weight: 500; border: 1px solid #D3D1CA; background: #fff; color: var(--tinta); }
    #barraDibujo .ok { border-color: var(--tinta); background: var(--tinta); color: #fff; }

    .sec { margin-bottom: 20px; } .sec h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .badge-s { font-size: 11px; font-weight: 500; border-radius: 2px; padding: 2px 6px; background: #E6E4DE; color: #3A3A37; margin-left: auto; } .badge-s.ok { background: #DDEBE1; color: #1F5A37; }
    .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .fd { display: flex; flex-direction: column; gap: 4px; min-width: 0; } .fd.w { grid-column: span 2; }
    .fd label { font-size: 12px; font-weight: 500; color: var(--gris); margin: 0 !important; }
    .fd input { height: 34px; border: 1px solid #D3D1CA; border-radius: 4px; padding: 0 10px; font-size: 13px; background: #fff; width: 100%; color: var(--tinta); }
    .fd input:disabled { background: #F2F1ED; } .fd small { font-size: 11px; color: var(--gris); } .fd small a { color: var(--tinta); } .fd .rev { color: #7A4B00; font-weight: 600; }
    .intro { margin: 0 0 12px; font-size: 13px; color: #3A3A37; line-height: 1.5; }
    .chk { border: 1px solid var(--borde); background: #fff; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
    .chk .top { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
    .chk .cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .chk .cols div { background: #F2F1ED; padding: 5px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .chk .cols b { font-size: 11px; font-weight: 500; color: var(--gris); } .chk .cols span { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cnt2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0 16px; } .cnt2 div { border: 1px solid var(--borde); background: #fff; padding: 10px 12px; }
    .cnt2 b { font-size: 24px; font-weight: 500; display: block; line-height: 1.1; font-family: 'IBM Plex Sans', system-ui, sans-serif; } .cnt2 span { font-size: 12px; color: var(--gris); }
    .hall { border: 1px solid var(--borde); background: #fff; padding: 10px 12px; margin-bottom: 6px; display: flex; flex-direction: column; gap: 6px; }
    .hall .t { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; } .hall q { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; background: #FFF1C2; padding: 3px 6px; quotes: none; } .hall a { color: var(--tinta); }
    .opt { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #D3D1CA; background: #fff; margin-bottom: 6px; text-align: left; border-radius: 4px; }
    .opt:hover { background: #F6F5F1; }
    .opt.on { border-width: 1.5px; } .opt .pt { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #8E8E89; flex: none; } .opt b { font-size: 13px; font-weight: 600; display: block; } .opt small { font-size: 12px; color: var(--gris); }
    textarea.razones { width: 100%; border-radius: 4px; border: 1px solid #D3D1CA; padding: 8px 10px; font-size: 13px; font-family: inherit; resize: vertical; background: #fff; }
    .dropz { border: 1.5px dashed #B9B6AD; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; background: #EFEDE7; cursor: pointer; margin-top: 8px; }
    .dropz.sobre { border-color: var(--tinta); background: #E6E4DE; }
    select.ejemplo { width: 100%; margin-top: 8px; height: 34px; border: 1px solid #D3D1CA; border-radius: 4px; padding: 0 8px; font-size: 13px; background: #fff; color: var(--gris); }
    /* ===== rediseño UX: panel con pestañas, selección en lote, panel de zona con «qué hacer ahora» ===== */
    #side { gap: 4px; }
    #side .ic { width: 56px; height: 54px; flex-direction: column; gap: 4px; }
    #side .ic .lb { font-size: 10px; font-weight: 500; line-height: 1; }
    #panel header { padding: 16px 18px 0; }
    .titulo h1 { font-size: 18px; }
